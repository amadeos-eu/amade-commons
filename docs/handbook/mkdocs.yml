site_name: amadeOS Application Developer's Handbook
site_description: Learn to write desktop applications in Java by building the amadeOS applications and their shared library, one application at a time.
site_author: datazuul
site_url: https://datazuul.github.io/amade-commons/
repo_url: https://github.com/datazuul/amade-commons
edit_uri: edit/main/docs/handbook/chapters/
copyright: © 2026 datazuul.com · EUPL-1.2
docs_dir: chapters

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # Code excerpts come from amade-commons itself and from the application repositories, checked out
      # next to amade-commons. Run mkdocs from docs/handbook; a missing file or section fails the build.
      base_path: ["../../.."]
      check_paths: true

nav:
  - Preface: index.md
  - Getting Started:
      - 0. Setting Up: 00-setup.md
      - 1. Why Swing and Our Own Library: 01-why-swing.md
      - 2. How an Application Is Built: 02-structure.md
  - "Part I: First Steps":
      - 10. Pad: 10-pad.md
      - 11. Web: 11-web.md
  - "Part II: Office":
      - 20. Files: 20-files.md
      - 21. Calendar: 21-calendar.md
      - 22. Mail: 22-mail.md
  - The Road Ahead: roadmap.md
