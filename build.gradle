plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

// JitPack publishes under com.github.<owner>; using the same coordinates locally lets an app's
// composite build (includeBuild '../amade-commons') replace the JitPack dependency automatically.
group = 'com.github.amadeos-eu'
// CI computes the version from the Conventional Commits since the last release tag and passes it as
// -PappVersion (amadeos-eu/amadeos-ci scripts/next-version.sh); a build without it is a local development build.
// Apps take released versions from JitPack by tag (com.github.amadeos-eu:amade-commons:v1.0.0).
version = findProperty('appVersion') ?: '0.0.0-dev.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // The sources and javadoc jars, which Maven Central requires, come from mavenPublishing below.
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.google.inject:guice:7.0.0'
    api 'org.slf4j:slf4j-api:2.0.17'
    // Only the programs that play with libmpv (eu.amadeos.commons.mpv) need JNA; they declare it themselves.
    compileOnly 'net.java.dev.jna:jna:5.14.0'
    testImplementation 'net.java.dev.jna:jna:5.14.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

test {
    useJUnitPlatform()
    // LaunchFeedback calls Xlib through the foreign function API.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'amade-commons',
            'Implementation-Version': project.version,
            'Automatic-Module-Name': 'eu.amadeos.commons'
        )
    }
}

// Releases from main also go to Maven Central as eu.amadeos:amade-commons (the namespace verified for
// amadeos.eu); the release workflow passes -PmavenCentral. Every other build, JitPack's and the composite
// builds of the apps included, keeps the JitPack coordinates above, so the apps' pins still match.
// Operating steps (Central Portal, signing key, secrets): chapter 8 of the amadeOS Betriebshandbuch.
def centralRelease = providers.gradleProperty('mavenCentral').isPresent()

mavenPublishing {
    coordinates(centralRelease ? 'eu.amadeos' : project.group.toString(), 'amade-commons', project.version.toString())
    if (centralRelease) {
        publishToMavenCentral(true)
        signAllPublications()
    }
    pom {
        name = 'amade-commons'
        description = 'Shared theme, Motif look and application infrastructure for amadeOS Swing applications'
        url = 'https://github.com/amadeos-eu/amade-commons'
        licenses {
            license {
                name = 'EUPL-1.2'
                url = 'https://interoperable-europe.ec.europa.eu/collection/eupl/eupl-text-eupl-12'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'datazuul'
                name = 'Ralf Eichinger'
                email = 'developers@datazuul.com'
                url = 'https://github.com/datazuul'
            }
        }
        organization {
            name = 'amadeOS'
            url = 'https://www.amadeos.eu'
        }
        scm {
            url = 'https://github.com/amadeos-eu/amade-commons'
            connection = 'scm:git:https://github.com/amadeos-eu/amade-commons.git'
            developerConnection = 'scm:git:ssh://git@github.com/amadeos-eu/amade-commons.git'
        }
        issueManagement {
            system = 'GitHub'
            url = 'https://github.com/amadeos-eu/amade-commons/issues'
        }
    }
}

// The Application Developer's Handbook (docs/handbook) as the Debian package amade-app-handbook
// (docs/handbook/package-deb.sh), which the amadeOS image installs; the Help drawer of the Front Panel
// lists it. The applications whose code the chapters show must be checked out next to amade-commons.
// The package version carries the date of the last commit to docs/handbook, so a new edition replaces the
// installed one.
def handbookVersion = {
    def stamp = ''
    try {
        stamp = ['git', 'log', '-1', '--format=%cd', '--date=format:%Y%m%d%H%M', '--', 'docs/handbook']
                .execute(null, projectDir).text.trim()
    } catch (IOException ignored) {
        // No git: the plain version.
    }
    // Debian sorts 1.1.0~dev.0 before 1.1.0 (with - it would sort after it).
    def debVersion = project.version.toString().replace('-', '~')
    stamp ? "${debVersion}+${stamp}" : debVersion
}

tasks.register('handbookDeb', Exec) {
    description = 'Builds the Debian package amade-app-handbook (the handbook for reading offline)'
    group = 'distribution'
    commandLine 'docs/handbook/package-deb.sh', handbookVersion(), layout.buildDirectory.dir('distributions').get().asFile.absolutePath
}

tasks.register('installToAmadeOs') {
    dependsOn 'handbookDeb'
    description = 'Builds and drops the handbook package into ../amadeos/config/packages.chroot/'
    group = 'distribution'

    doLast {
        def targetDir = file('../amadeos/config/packages.chroot')
        targetDir.mkdirs()
        def debFile = new File(layout.buildDirectory.get().asFile, "distributions/amade-app-handbook_${handbookVersion()}_all.deb")
        copy {
            from debFile
            into targetDir
        }
        println "[installToAmadeOs] Copied ${debFile.name} to ${targetDir.absolutePath}"
    }
}
