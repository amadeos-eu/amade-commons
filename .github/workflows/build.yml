name: Build

# develop builds X.Y.Z-dev.N, release X.Y.Z-pre.N and main the release X.Y.Z, which the release job
# tags; JitPack builds the tag for the apps (see CONTRIBUTING.md of amadeos-eu/amadeos, "Commits and versions").
on:
  push:
    branches: [develop, release, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is computed from the history since the last release tag.
          fetch-depth: 0
      - id: version
        uses: amadeos-eu/amadeos-ci/version@main
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Plain actions/cache instead of the proprietary enhanced cache that is the v6 default.
          cache-provider: basic
      # The Swing integration tests skip themselves without a display, so run under Xvfb.
      - name: Test
        run: xvfb-run --auto-servernum ./gradlew test jar --no-daemon -PappVersion=${{ steps.version.outputs.version }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test

  # Only on main, after the release branch was promoted: tag vX.Y.Z and publish the GitHub Release.
  release:
    needs: test
    if: needs.test.outputs.channel == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: amadeos-eu/amadeos-ci/release@main
        with:
          version: ${{ needs.test.outputs.version }}

  # Only on main, after the release job tagged vX.Y.Z: the library to Maven Central as eu.amadeos:amade-commons.
  # Account, signing key and the five secrets: chapter 8 of the amadeOS Betriebshandbuch. Without the secrets
  # the job only says so, so a release still goes through before Central is set up.
  central:
    needs: [test, release]
    if: needs.test.outputs.channel == 'release'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSPHRASE }}
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "::warning::Maven Central secrets are not set; the release is not published to Maven Central."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.publish == 'true'
      - uses: actions/setup-java@v6
        if: steps.secrets.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.secrets.outputs.publish == 'true'
        with:
          cache-provider: basic
      - name: Publish to Maven Central
        if: steps.secrets.outputs.publish == 'true'
        run: ./gradlew publishToMavenCentral --no-daemon -PmavenCentral -PappVersion=${{ needs.test.outputs.version }}

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: amadeos-eu/amadeos-ci/check-commits@main
