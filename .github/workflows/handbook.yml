name: Handbook

# Builds the amadeOS Application Developer's Handbook (docs/handbook) and publishes it on GitHub Pages.
# The code excerpts come from amade-commons itself and from the application repositories, checked out
# next to it at the commits below, the state the chapters describe. Raise a commit when a chapter is
# updated for it.

on:
  push:
    branches: [main]
    paths: ['docs/handbook/**', 'src/main/**', '.github/workflows/handbook.yml']
  pull_request:
    paths: ['docs/handbook/**', 'src/main/**', '.github/workflows/handbook.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Full hashes: actions/checkout does not take short ones.
  PAD_COMMIT: 910e537d05103d68eeadf49beeac54d1a43045bc
  WEB_COMMIT: d43fbd11e15f1b9ca7af854502ff101b7d5d332c
  FILES_COMMIT: d728237827f756c06e08bfb7f1fc8f4169f40686
  CALENDAR_COMMIT: 6a7c2dbef011ff1aa82e6c83f066e39140fe5a0e
  MAIL_COMMIT: ccb1c737434f08b6fd1718c6317df32f3276653d
  WRITEPAD_COMMIT: c0a2004b747785b5b922343e57ab3947840c3555
  FRACTALS_COMMIT: e7120e5859678a815effec10a76e25902ef04cec
  IMAGESCAN_COMMIT: a2f7779cc38b08f2637a9cf1265f49016b48a672
  AUDIO_COMMIT: cb3d105938fafcbb6535cf0cd571682f7792148a
  VIDEO_COMMIT: 0aa0ed30d12a996b80aac2d86cbf1373354f5b8b
  SCREENSHOT_COMMIT: 5cf855040f5760c8a9d7788bb885da5da66fdccd
  CALCULATOR_COMMIT: 059b1dfe29cfa5f92e84c4bc53abe9b996fc543a
  CONTACTS_COMMIT: cd0346ac51ee0d410eb755f6184b6d804900f7b8
  IMAGEVIEWER_COMMIT: bc237ed749bf165926f45198fbfa5cf449e8ac2f
  PDFVIEWER_COMMIT: ed5cdfe43962a515620a267d99b6e68eda4f7985
  BOOKS_COMMIT: e7316c86be713d08dcc9916ae3798814c48f918f
  TV_COMMIT: 6ff5dafc74fad1ea7e1f089875514627ec15b88a
  BACKUP_COMMIT: 493e812183b8af38e2bec37209def9bf95d5d3d4
  # Part VI: the desktop modules.
  AMADEOS_SYSTEM_COMMIT: b007e3c86e8c379ea3df92b3fc48ffac42d2e5ab
  # Chapter 51: the version and release scripts.
  AMADEOS_CI_COMMIT: c5d64042b79c899bb73df6034dbe366bc06e782a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: amade-commons
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-pad
          ref: ${{ env.PAD_COMMIT }}
          path: amade-pad
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-web
          ref: ${{ env.WEB_COMMIT }}
          path: amade-web
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-files
          ref: ${{ env.FILES_COMMIT }}
          path: amade-files
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-calendar
          ref: ${{ env.CALENDAR_COMMIT }}
          path: amade-calendar
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-mail
          ref: ${{ env.MAIL_COMMIT }}
          path: amade-mail
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-writepad
          ref: ${{ env.WRITEPAD_COMMIT }}
          path: amade-writepad
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-fractals
          ref: ${{ env.FRACTALS_COMMIT }}
          path: amade-fractals
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-imagescan
          ref: ${{ env.IMAGESCAN_COMMIT }}
          path: amade-imagescan
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-audio
          ref: ${{ env.AUDIO_COMMIT }}
          path: amade-audio
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-video
          ref: ${{ env.VIDEO_COMMIT }}
          path: amade-video
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-screenshot
          ref: ${{ env.SCREENSHOT_COMMIT }}
          path: amade-screenshot
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-calculator
          ref: ${{ env.CALCULATOR_COMMIT }}
          path: amade-calculator
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-contacts
          ref: ${{ env.CONTACTS_COMMIT }}
          path: amade-contacts
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-imageviewer
          ref: ${{ env.IMAGEVIEWER_COMMIT }}
          path: amade-imageviewer
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-pdfviewer
          ref: ${{ env.PDFVIEWER_COMMIT }}
          path: amade-pdfviewer
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-books
          ref: ${{ env.BOOKS_COMMIT }}
          path: amade-books
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-tv
          ref: ${{ env.TV_COMMIT }}
          path: amade-tv
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-backup
          ref: ${{ env.BACKUP_COMMIT }}
          path: amade-backup
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amadeos-system
          ref: ${{ env.AMADEOS_SYSTEM_COMMIT }}
          path: amadeos-system
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amadeos-ci
          ref: ${{ env.AMADEOS_CI_COMMIT }}
          path: amadeos-ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install MkDocs
        run: pip install -r amade-commons/docs/handbook/requirements.txt
      # Strict: a broken link or a missing code excerpt fails the build.
      - name: Build
        working-directory: amade-commons/docs/handbook
        run: mkdocs build --strict --site-dir "$GITHUB_WORKSPACE/site"
      # The offline variant of the Debian package amade-app-handbook (package-deb.sh) must build too.
      - name: Build offline variant
        working-directory: amade-commons/docs/handbook
        run: mkdocs build --strict -f mkdocs-offline.yml --site-dir "$RUNNER_TEMP/site-offline"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
