name: Handbook

# Builds the amadeOS Application Developer's Handbook (docs/handbook) and publishes it on GitHub Pages.
# The code excerpts come from amade-commons itself and from the application repositories, checked out
# next to it at the commits below, the state the chapters describe. Raise a commit when a chapter is
# updated for it.

on:
  push:
    branches: [main]
    paths: ['docs/handbook/**', 'src/main/**', '.github/workflows/handbook.yml']
  pull_request:
    paths: ['docs/handbook/**', 'src/main/**', '.github/workflows/handbook.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Full hashes: actions/checkout does not take short ones.
  PAD_COMMIT: 910e537d05103d68eeadf49beeac54d1a43045bc
  WEB_COMMIT: d43fbd11e15f1b9ca7af854502ff101b7d5d332c
  FILES_COMMIT: 7cfa055206a184eee62126356ba3876af6e6c208
  CALENDAR_COMMIT: 0bb08379e4b9681638e67568738335c7dee14434
  MAIL_COMMIT: 0a2daa0c3e72074ba575e21f3e1b0b4dfd1cb822
  WRITEPAD_COMMIT: ab70cb72667030941ecec072251587eada1c0390
  FRACTALS_COMMIT: e7120e5859678a815effec10a76e25902ef04cec
  IMAGESCAN_COMMIT: a2f7779cc38b08f2637a9cf1265f49016b48a672
  AUDIO_COMMIT: abba6bfea624f280fea4ce6dfc41dc97cc19d7e0
  VIDEO_COMMIT: 0aa0ed30d12a996b80aac2d86cbf1373354f5b8b
  SCREENSHOT_COMMIT: 5cf855040f5760c8a9d7788bb885da5da66fdccd
  CALCULATOR_COMMIT: 059b1dfe29cfa5f92e84c4bc53abe9b996fc543a
  CONTACTS_COMMIT: cd0346ac51ee0d410eb755f6184b6d804900f7b8
  IMAGEVIEWER_COMMIT: bc237ed749bf165926f45198fbfa5cf449e8ac2f
  PDFVIEWER_COMMIT: ed5cdfe43962a515620a267d99b6e68eda4f7985
  BOOKS_COMMIT: e7316c86be713d08dcc9916ae3798814c48f918f
  BOOKEDITOR_COMMIT: 9334b142c057b611bbe4d0c6100762662bd92625
  TV_COMMIT: 797e3f79c731e0cf4ad5245eddc1ead2569ce5d5
  BACKUP_COMMIT: 7bf897ce0dd1d44b32a59dad38524723a9f8ab88
  NEWS_COMMIT: 2161f48ca22e54cfd293e5e8f15fa15362b2f1cd
  IMAGEEDITOR_COMMIT: 0750100e9c4090cfd1fd1c60e0d75db4b25d2ca0
  WEBCAM_COMMIT: 8beed5bb6d52ee8124a9c3a7811f9c683e61c8f6
  TERMINAL_COMMIT: bf595b4a4111e8da64dc9620b08fe3b2f7c34179
  FONTVIEWER_COMMIT: 84c36222d042d36f117c4719aa2e2261ee959439
  # Part VIII.
  CALL_COMMIT: 945ddede7b0b3676eba1f6f23fe853544393f0a4
  # Part VI: the desktop modules.
  AMADEOS_SYSTEM_COMMIT: ce102ef356e0aef9d6d38866025f43a9d2090b37
  # Chapter 51: the version and release scripts.
  AMADEOS_CI_COMMIT: c5d64042b79c899bb73df6034dbe366bc06e782a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: amade-commons
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-pad
          ref: ${{ env.PAD_COMMIT }}
          path: amade-pad
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-web
          ref: ${{ env.WEB_COMMIT }}
          path: amade-web
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-files
          ref: ${{ env.FILES_COMMIT }}
          path: amade-files
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-calendar
          ref: ${{ env.CALENDAR_COMMIT }}
          path: amade-calendar
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-mail
          ref: ${{ env.MAIL_COMMIT }}
          path: amade-mail
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-writepad
          ref: ${{ env.WRITEPAD_COMMIT }}
          path: amade-writepad
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-fractals
          ref: ${{ env.FRACTALS_COMMIT }}
          path: amade-fractals
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-imagescan
          ref: ${{ env.IMAGESCAN_COMMIT }}
          path: amade-imagescan
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-audio
          ref: ${{ env.AUDIO_COMMIT }}
          path: amade-audio
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-video
          ref: ${{ env.VIDEO_COMMIT }}
          path: amade-video
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-screenshot
          ref: ${{ env.SCREENSHOT_COMMIT }}
          path: amade-screenshot
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-calculator
          ref: ${{ env.CALCULATOR_COMMIT }}
          path: amade-calculator
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-contacts
          ref: ${{ env.CONTACTS_COMMIT }}
          path: amade-contacts
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-imageviewer
          ref: ${{ env.IMAGEVIEWER_COMMIT }}
          path: amade-imageviewer
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-pdfviewer
          ref: ${{ env.PDFVIEWER_COMMIT }}
          path: amade-pdfviewer
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-books
          ref: ${{ env.BOOKS_COMMIT }}
          path: amade-books
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-bookeditor
          ref: ${{ env.BOOKEDITOR_COMMIT }}
          path: amade-bookeditor
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-tv
          ref: ${{ env.TV_COMMIT }}
          path: amade-tv
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-backup
          ref: ${{ env.BACKUP_COMMIT }}
          path: amade-backup
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-news
          ref: ${{ env.NEWS_COMMIT }}
          path: amade-news
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-imageeditor
          ref: ${{ env.IMAGEEDITOR_COMMIT }}
          path: amade-imageeditor
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-webcam
          ref: ${{ env.WEBCAM_COMMIT }}
          path: amade-webcam
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-terminal
          ref: ${{ env.TERMINAL_COMMIT }}
          path: amade-terminal
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-fontviewer
          ref: ${{ env.FONTVIEWER_COMMIT }}
          path: amade-fontviewer
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amade-call
          ref: ${{ env.CALL_COMMIT }}
          path: amade-call
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amadeos-system
          ref: ${{ env.AMADEOS_SYSTEM_COMMIT }}
          path: amadeos-system
      - uses: actions/checkout@v7
        with:
          repository: amadeos-eu/amadeos-ci
          ref: ${{ env.AMADEOS_CI_COMMIT }}
          path: amadeos-ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install MkDocs
        run: pip install -r amade-commons/docs/handbook/requirements.txt
      # Strict: a broken link or a missing code excerpt fails the build.
      - name: Build
        working-directory: amade-commons/docs/handbook
        run: mkdocs build --strict --site-dir "$GITHUB_WORKSPACE/site"
      # The offline variant of the Debian package amade-app-handbook (package-deb.sh) must build too.
      - name: Build offline variant
        working-directory: amade-commons/docs/handbook
        run: mkdocs build --strict -f mkdocs-offline.yml --site-dir "$RUNNER_TEMP/site-offline"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
